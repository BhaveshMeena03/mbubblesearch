<!DOCTYPE html>
<!-- The @mbubbleSearch header image, 1500x500 (rendered at 3x). Render with:
       node scripts/make_x_banner.mjs

     Same rule as the share cards: nothing that goes stale. The last banner
     said "Three archives, 1,111 hours" and carried episode counts for three
     shows, all of it wrong within weeks. The one figure here is a floor,
     "1,900+ hours" (1,967 when drawn), which the archive only grows past.

     The bottom-left corner is left empty: on a profile the avatar sits over
     it, roughly the first 380px across and the last 170px down. And X crops
     the banner shorter on narrow screens, off the top and bottom, so the
     block is centred with the bottom 90px left empty. -->
<html><head><meta charset="utf-8"><style>
  @font-face { font-family: "Instrument Serif";
    src: url("fonts/InstrumentSerif-Regular.ttf") format("truetype"); }
  @font-face { font-family: "InterV";
    src: url("fonts/Inter-Variable.ttf") format("truetype"); }
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0b0e11;--ink:#eef0f3;--ink2:#a7adb8;--ink3:#6e7582;--edge:#232833;
        --green:#16c784}
  body{width:1500px;height:500px;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"InterV",-apple-system,BlinkMacSystemFont,sans-serif;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding-bottom:90px}
  .glow{position:absolute;left:50%;top:-420px;transform:translateX(-50%);
    width:1500px;height:820px;border-radius:50%;
    background:radial-gradient(circle,rgba(22,199,132,.20),rgba(22,199,132,.05) 45%,transparent 68%)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .eyebrow{position:relative;font-size:15px;letter-spacing:.3em;text-transform:uppercase;
    color:var(--green);font-weight:600}
  .eyebrow span{color:var(--ink3);margin:0 12px}
  h1{position:relative;margin-top:22px;font-family:"Instrument Serif",Georgia,serif;
    font-weight:400;font-size:92px;line-height:1;letter-spacing:-1.6px;text-align:center}
  h1 em{font-style:italic;color:var(--green);padding-right:.06em}
  .sub{position:relative;margin-top:22px;font-size:23px;color:var(--ink2)}
  .sub b{color:var(--ink);font-weight:600}
  .rooms{position:relative;display:flex;gap:14px;margin-top:34px}
  .rooms span{display:flex;align-items:center;gap:11px;padding:11px 20px;
    border:1.5px solid var(--edge);border-radius:99px;background:rgba(255,255,255,.025);
    font-size:18px;color:var(--ink)}
  .rooms i{width:10px;height:10px;border-radius:50%;background:var(--c)}
  .ask{position:relative;margin-top:30px;font-size:15px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink3)}
  .ask b{color:var(--ink2);font-weight:500;letter-spacing:.08em;text-transform:none;font-size:17px}
</style></head><body>
  <div class="glow"></div>
  <div class="eyebrow mono">Market Bubble<span>&middot;</span>Search</div>
  <h1>Ask anything. Jump to <em>the exact second</em>.</h1>
  <div class="sub"><b>1,900+ hours</b> of crypto shows and long-form interviews, transcribed and searchable by meaning.</div>
  <div class="rooms">
    <span style="--c:#16c784"><i></i>Market Bubble</span>
    <span style="--c:#6ecf9e"><i></i>MCG Live</span>
    <span style="--c:#6aa9ff"><i></i>ThreadGuy</span>
    <span style="--c:#e0485c"><i></i>Elon Musk</span>
    <span style="--c:#d8b48a"><i></i>The Record</span>
  </div>
  <div class="ask mono">tag <b>@mbubbleSearch</b> with a question</div>
</body></html>
