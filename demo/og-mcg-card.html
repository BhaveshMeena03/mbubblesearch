<!DOCTYPE html>
<!-- Source for the 1200x630 social preview image on the MCG page
     (og-mcg.png). Re-render after edits:
       node scripts/make_og_image.mjs mcg

     The card it replaces was a PNG with no source in the repo, so its
     numbers -- 458 episodes, 444 hours -- could only go stale, and did:
     it was still claiming them under a reply that said 634 and 1,002,
     which is the first thing MCG saw. Numbers here are the ones the
     archive actually holds, and this file is where to change them. -->
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#0b0e11;color:#e6e8ea;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;justify-content:center;padding:72px 80px;
    position:relative;overflow:hidden}
  .glow{position:absolute;right:-180px;top:-180px;width:560px;height:560px;
    border-radius:50%;background:radial-gradient(circle,#16c78426,transparent 70%)}
  .brand{font-weight:800;font-size:26px;letter-spacing:1px;margin-bottom:30px}
  .brand span{color:#16c784}
  h1{font-size:62px;font-weight:800;line-height:1.1;margin-bottom:18px}
  h1 em{color:#16c784;font-style:normal}
  .sub{font-size:27px;color:#8a939e;line-height:1.4;margin-bottom:40px}
  .searchbox{display:flex;align-items:center;gap:16px;background:#12161c;
    border:2px solid #16c784;border-radius:16px;padding:20px 26px;width:900px}
  .searchbox .q{font-size:25px;color:#e6e8ea;flex:1}
  .searchbox .btn{background:#16c784;color:#0b0e11;font-weight:700;
    font-size:21px;border-radius:10px;padding:11px 24px}
  .readout{display:flex;gap:56px;margin-top:38px}
  .n{font-size:38px;font-weight:800;line-height:1;
     font-variant-numeric:tabular-nums}
  .n span{font-size:19px;font-weight:600;color:#8a939e;margin-left:7px}
  .who{font-size:14px;font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;color:#16c784;margin-top:9px}
</style></head><body>
  <div class="glow"></div>
  <div class="brand">THE MCG <span>INDEX</span></div>
  <h1>Ask MCG Live <em>anything.</em></h1>
  <div class="sub">Every interview and every live stream, indexed by
  meaning — and it lands on the second it was said.</div>
  <div class="searchbox">
    <div class="q">who is building encrypted mesh networks?</div>
    <div class="btn">Search</div>
  </div>
  <div class="readout">
    <div><div class="n">645 <span>episodes</span></div>
      <div class="who">indexed</div></div>
    <div><div class="n">1,025 <span>hours</span></div>
      <div class="who">transcribed</div></div>
    <div><div class="n">2025&ndash;2026 <span></span></div>
      <div class="who">span</div></div>
  </div>
</body></html>
