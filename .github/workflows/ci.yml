name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The binary, not the python wrapper. voyageai pulls in ffmpeg-python,
      # which is bindings and no executable, so three clipper tests died on
      # FileNotFoundError: 'ffmpeg'. Skipping them instead would leave
      # _has_audio and leading_video_gap unverified in CI, and render.yaml
      # treats ffmpeg's behaviour as a production concern -- a max-quality
      # encode peaks near 1GB and OOM-kills a smaller box.
      #
      # Bounded, and retried. On 22 and 23 Oct 2026 this step hung for over
      # twenty minutes on a stalled package mirror, twice, with lint and the
      # tests never starting; both runs had to be cancelled by hand. Each
      # attempt now gets 150 seconds, three attempts, and the step a hard
      # ceiling, so a bad mirror means a retry or a red run, never a hang.
      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            if timeout 150 sudo apt-get update -o Acquire::Retries=3 \
               && timeout 150 sudo apt-get install -y --no-install-recommends ffmpeg; then
              exit 0
            fi
            echo "ffmpeg install attempt $attempt stalled or failed; retrying"
            sleep 10
          done
          exit 1

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q
        env:
          ANTHROPIC_API_KEY: test-key
          VOYAGE_API_KEY: test-key
          PINECONE_API_KEY: test-key
